<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%" fill="none">
  <!-- 
    xiaominART 官方品牌标识 (深色模式 · 方案二深化版)
    - 符号：【斗升小民】量具金石古印（镂空透底、古朴厚重）
    - 上行：扁平化现代无衬线英文 xiaominART
    - 下行：中文副标「小民艺术 · 日常表达」，两端与上方英文 100% 绝对等宽对齐
  -->

  <!-- 左侧镂空古印符号：斗升金石印 (Hollow Measure Seal) -->
  <g transform="translate(6, 4)">
    <!-- 传统量具“斗”外廓：稳重金石厚壁镂空框 -->
    <path d="M12 14 L52 14 L46 52 L18 52 Z" 
          stroke="#C83C23" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    
    <!-- 内层辅助微细框（斑驳金石质感） -->
    <path d="M16.5 18 L47.5 18 L42.5 48 L21.5 48 Z" 
          stroke="#C83C23" stroke-width="0.8" stroke-opacity="0.35" stroke-linejoin="round" fill="none"/>

    <!-- 斗内升起的苍劲中锋墨痕与文脉立轴 -->
    <path d="M32 8 V40" 
          stroke="#D8482E" stroke-width="3.2" stroke-linecap="round"/>
          
    <!-- 气韵横折弧线（兼具行书飞白与器物盛物之意） -->
    <path d="M23 29 Q32 36 41 29" 
          stroke="#D8482E" stroke-width="2.8" stroke-linecap="round" fill="none"/>
          
    <!-- 斗心点睛墨滴/星火印记 -->
    <circle cx="32" cy="46" r="2.2" fill="#D8482E"/>
    
    <!-- 金石残缺微细节 -->
    <circle cx="14" cy="14" r="1" fill="#C83C23" opacity="0.6"/>
    <circle cx="50" cy="14" r="1" fill="#C83C23" opacity="0.6"/>
  </g>

  <!-- 右侧字标组合：上下两端通过 textLength 达到绝对严丝合缝等宽 (260px) -->
  <g transform="translate(86, 0)">
    <!-- 上行：扁平化现代无衬线英文 xiaominART (精确宽度 260px) -->
    <text x="0" y="36" 
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="31" 
          font-weight="400" 
          fill="#F8F6F0" 
          letter-spacing="0.8"
          textLength="260"
          lengthAdjust="spacing">
      xiaomin<tspan font-weight="800" fill="#E2B878" letter-spacing="1.5">ART</tspan>
    </text>

    <!-- 下行：中文「小民艺术 · 日常表达」（精确宽度 260px，与上方完全等宽两端对齐） -->
    <text x="0" y="60" 
          font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif" 
          font-size="12.5" 
          font-weight="600" 
          fill="#B5B2AA" 
          textLength="260"
          lengthAdjust="spacing">
      小民艺术 · 日常表达
    </text>
  </g>
</svg>
