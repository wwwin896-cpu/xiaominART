# ═════════════════════════════════════════════════════════════
# xiaominart.com · nginx 站点配置（阿里云轻量应用服务器）
#
# 部署位置：/etc/nginx/sites-available/xiaominart
# 启用：ln -s /etc/nginx/sites-available/xiaominart /etc/nginx/sites-enabled/
#
# 分工：
#   nginx      静态 dist/、gzip、缓存头、CSP、301
#   Node 8787  只处理 /api/*（见 server/index.mjs，pm2 守护）
#
# ⚠️ 三条从 Cloudflare 平移时必须守住的东西（漏一条网站就"看着正常但暗地出问题"）：
#   1. CSP —— 尤其 worker-src 'self' blob:，缺了 Knocket 聊天会静默失效
#   2. 301  —— 72 条旧地址规则，丢了会掉已收录的外链权重
#   3. 缓存分层 —— /_astro/ 是带 hash 的，可以 immutable；HTML 不能长缓存
# ═════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name xiaominart.com www.xiaominart.com;

    # ── 备案期间先用 HTTP ──
    # 证书签好后（certbot 或阿里云免费证书），把下面这行取消注释并改成：
    #   return 301 https://$host$request_uri;
    # certbot 也会自动改写本文件，两者取其一即可。

    root /var/www/xiaominart/dist;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 上传体积上限（表单 16KB 足够，留余量给极端情况）
    client_max_body_size 2m;

    # ── gzip ──
    # 静态站 90% 是文本，gzip 能把首屏传输量压到 1/4。
    # 注意：不要对图片再压（webp/jpg 已是压缩格式，白费 CPU）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml;

    # ═════════════════════════════════════════════════════════
    # 一、API 反代
    # ═════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 表单提交要等云端落库 + 触发通知，30s 足够；再长说明云端有问题
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # 接口一律不缓存、不被索引（与 functions/*.ts 里的头保持一致）
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag  "noindex, nofollow" always;
        include snippets/xiaominart-security.conf;
    }

    # ═════════════════════════════════════════════════════════
    # 二、旧地址 301
    # ⚠️ 由 deploy/gen-nginx-redirects.mjs 从 public/_redirects 生成
    #    改规则请改 _redirects，再跑一次脚本，不要直接改生成文件
    # ═════════════════════════════════════════════════════════
    include snippets/xiaominart-redirects.conf;

    # ═════════════════════════════════════════════════════════
    # 三、缓存分层
    #
    # ⚠️ nginx 的 add_header 有"覆盖"语义：location 里只要出现一条
    #    add_header，server 级的所有 add_header 全部失效。所以每个
    #    location 都必须 include 一次安全头，否则该路径就裸奔。
    # ═════════════════════════════════════════════════════════

    # 构建产物：文件名带内容哈希，可永久缓存
    location /_astro/ {
        include snippets/xiaominart-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 品牌标识：文件名固定，业主会换图 → 只给 1 小时（Cloudflare 时代踩过：
    # 14 天缓存导致换了 LOGO 业主自己看不到变化）
    location /assets/brand/ {
        include snippets/xiaominart-security.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # 图片等静态资源：14 天
    location /assets/ {
        include snippets/xiaominart-security.conf;
        add_header Cache-Control "public, max-age=1209600, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # 下载文件：1 小时。业主改完需求表希望尽快生效
    location /downloads/ {
        include snippets/xiaominart-security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # 站内搜索索引：10 分钟。入口 JSON 是固定 URL，长缓存会搜不到新内容
    location /pagefind/ {
        include snippets/xiaominart-security.conf;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        try_files $uri =404;
    }

    # ── HTML 与其余：不做长缓存 ──
    # Astro 的 trailingSlash: 'always' 意味着页面都在 /path/index.html
    location / {
        include snippets/xiaominart-security.conf;

        # 先找文件（/favicon.svg），再找目录首页（/gifts/ → /gifts/index.html）
        try_files $uri $uri/index.html $uri/ =404;

        # HTML 不缓存：业主改完文案要立刻生效，否则又是"改了看不到"
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/xiaominart-security.conf;
    }

    # ── 隐藏文件兜底：不要把 .env / .git 暴露出去 ──
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}

# ═════════════════════════════════════════════════════════════
# HTTPS（备案通过 + 证书签发后启用）
#
# 签证书两种方式，选一种：
#   A. certbot：apt install certbot python3-certbot-nginx
#      certbot --nginx -d xiaominart.com -d www.xiaominart.com
#      → 会自动改写上面的 server 块并加本段
#   B. 阿里云免费 SSL 证书：下载 nginx 版 .pem/.key 放到
#      /etc/nginx/ssl/，再取消下面注释
#
# 提示：备案未通过前域名不走境内，签证书会失败。顺序是 备案 → 切 DNS → 签证书。
# ═════════════════════════════════════════════════════════════
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name xiaominart.com www.xiaominart.com;
#
#     ssl_certificate     /etc/nginx/ssl/xiaominart.com.pem;
#     ssl_certificate_key /etc/nginx/ssl/xiaominart.com.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # 其余 location 与上面 80 端口那段完全一致，可复制过来
# }
