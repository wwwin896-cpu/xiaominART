# ═════════════════════════════════════════════════════════════
# 全站安全头（nginx snippet）
#
# 用法：在每个 location 里 `include snippets/xiaominart-security.conf;`
# ⚠️ 必须逐个 location include —— nginx 的 add_header 是"覆盖"而非"继承"：
#    location 内一旦出现任何 add_header，server 级的全部失效。
#
# 内容与 public/_headers 的 `/*` 段**逐字对齐**，改一处必须同步改另一处
# （Cloudflare 与阿里云并行期间两边都要对）。
# ═════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;

# ⚠️ CSP 四个已踩过的坑（2026-10-18 用了两个晚上定位，勿删注释）：
#   1. `https://*.trtc.io` **不匹配裸域** `https://trtc.io` ——
#      Knocket 的样式表恰好在裸域，只写通配会让面板出来但样式全崩。
#      故每条指令都同时写裸域与通配。
#   2. 腾讯 IM 长连接是动态调度的（实测 wss://20032564w4s.my-imcloud.com），
#      还会回退到 wss.im.tencent.cn / wss.tim.qq.com / 裸 IP。
#      IP 无法通配，故 connect-src 直接放行 `wss:`（本站自身不用 WebSocket）。
#   3. TIM SDK 用 `new Worker(blobURL)` 建 socket/timer 两个 Worker；
#      worker-src 未设置时回退 script-src，而 script-src 没有 blob:
#      → new Worker 抛 SecurityError 且被 SDK 吞掉 → 输入框 contenteditable=false
#      → 表现「能看不能打字」，无任何报错。**worker-src 'self' blob: 是总开关。**
#   4. 百度统计以 img/beacon 形式上报，connect-src 与 img-src 都要放行。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://hm.baidu.com https://trtc.io https://*.trtc.io; style-src 'self' 'unsafe-inline' https://trtc.io https://*.trtc.io; img-src 'self' data: https://hm.baidu.com https://*.baidu.com https://trtc.io https://*.trtc.io https://*.qcloud.com https://console.trtc.io; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https://trtc.io https://*.trtc.io https://*.qcloud.com; connect-src 'self' https://hm.baidu.com https://*.baidu.com https://trtc.io https://*.trtc.io https://*.qcloud.com https://*.myqcloud.com https://*.my-imcloud.com https://*.tencent.cn https://*.tim.qq.com https://console.trtc.io wss:; frame-src 'self' https://trtc.io https://*.trtc.io https://*.qcloud.com; worker-src 'self' blob:; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
