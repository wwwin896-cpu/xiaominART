body: |
  ## 为新居准备一份不喧哗的礼

  如果你从小红书看到一件礼物，可以先从 [乔迁之喜](/occasions/housewarming/) 开始了解：适合送给谁、有什么寓意、怎么包装，以及如何进一步获得送礼建议。

  还不确定预算或对象时，可以进入 [选礼指南](/gift-guide/)。
