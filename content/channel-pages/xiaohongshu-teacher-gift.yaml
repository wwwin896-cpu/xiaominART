body: |
  ## 把感谢写下来

  如果你正在为老师寻找一份礼物，可以从 [感谢恩师 / 朋友](/occasions/teacher-thanks/) 了解礼物寓意、包装和交付参考。

  如果收礼对象、预算或时间还不确定，可以进入 [按对象选礼](/gift-guide/by-recipient/)。
