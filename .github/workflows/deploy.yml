# ─────────────────────────────────────────────────────────────
# 自动部署：main 分支有新提交（含后台保存的内容）→ 构建静态站 → 部署 Cloudflare Pages
#
# 首次启用前，需在 GitHub 仓库配置两个 Actions secret：
#   （仓库页面 → Settings → Secrets and variables → Actions → New repository secret）
#   CLOUDFLARE_API_TOKEN   Cloudflare API 令牌（Pages Edit 权限，与手动部署用同一个）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID：fc5bdc20f05edbbfa43081b6a8f6c672
#
# Pages Functions 运行时变量（2026-10-09 新增，替代 Cloudflare 面板配置）：
#   Secrets（加密，Settings → Secrets and variables → Actions → Secrets）：
#     FORMS_ACCESS_KEY   云数据库访问密钥（/api/lead、/api/event、/api/progress）
#     RESEND_API_KEY     邮件通道 Resend 密钥
#     ADMIN_ACCESS_KEY   进度录入后台口令（/api/admin/progress，可选）
#     BAIDU_PUSH_TOKEN   百度「主动推送」准入密钥（可选，未配置则跳过推送）
#                        取处：百度搜索资源平台 → 普通收录 → API 提交
#   Variables（明文，同一页面的 Variables 标签）：
#     FEISHU_WEBHOOK_URL 飞书群机器人 Webhook（表单通知主通道）
#     RESEND_TO_EMAIL    通知收件邮箱
#   未配置的变量在下方步骤会显示「⚠ 为空」；对应功能会静默降级（如未配 key 则 /api/lead 返回 503）。
#
# 百度收录策略（2026-10-09）：
#   sitemap 提交对新验证站点有配额释放期（面板显示「今日上限 0 条」，需 1-3 天），
#   故改用「主动推送」（快速收录 API）——当天可用、实时进抓取队列，本站配额 10 条/天。
#   因配额有限，单次部署通常只能推一部分 URL，剩余的在后续部署中滚动补推（重复推送幂等）。
# ─────────────────────────────────────────────────────────────
name: Deploy site

on:
  push:
    branches: [main]
    # 只含推送进度的提交不该触发部署：否则「部署→推送→回写进度→再部署」自激循环。
    # 与提交信息里的 [skip ci] 双保险（前者防循环，后者省一次 run）。
    paths-ignore:
      - '.baidu-pushed.json'
  workflow_dispatch: {}

# 进度文件要提交回 main，GITHUB_TOKEN 默认只读，必须显式给写权限。
permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：sitemap 的 lastmod 取每个内容源文件的最后一次 git 提交时间（src/lib/seo.ts）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 质量门禁：类型/模板诊断不过就不部署。
      # 注意：必须在 Build 之前跑 —— astro check 会把 dist/ 等构建产物一并扫描，
      # 既慢又会在内联脚本上报假错误；tsconfig.json 的 exclude 已排除这些目录。
      - name: Type & template check
        run: npm run check

      # 回归测试：百度推送的游标必须每次前进（2026-10-18 修复「每天重复推前 10 条」）。
      # 纯离线测试（fetch 被打桩），不消耗真实配额，秒级完成。
      - name: Baidu push cursor regression test
        run: npm run test:baidu

      - name: Build
        run: npm run build
        env:
          # 后台界面把 App slug 内联进构建产物（import.meta.env.PUBLIC_*），
          # GitHub 上没有 .env，需要在这里显式提供。此值公开，非密钥。
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: wwwin896-cpu-keystatic

      # 发布校验（T-08「上线即入图」）：任何可索引页漏出 sitemap 或 sitemap 出现死图都会失败
      - name: Sitemap consistency check
        run: npm run check:sitemap

      # Pages Functions 运行时变量：写成 --env-file 供 wrangler pages deploy 注入。
      # 敏感值（FORMS_ACCESS_KEY / RESEND_API_KEY）来自 Repository Secrets；
      # 非敏感值（Webhook URL、收件邮箱）来自 Repository Variables（vars）。
      - name: Write Pages runtime env file
        run: |
          set -euo pipefail
          {
            echo "FORMS_ACCESS_KEY=${{ secrets.FORMS_ACCESS_KEY }}"
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "FEISHU_WEBHOOK_URL=${{ vars.FEISHU_WEBHOOK_URL }}"
            echo "RESEND_TO_EMAIL=${{ vars.RESEND_TO_EMAIL }}"
            echo "ADMIN_ACCESS_KEY=${{ secrets.ADMIN_ACCESS_KEY }}"
          } > .env.pages-runtime
          # 安全：只打印变量名与是否有值，绝不打印值本身
          echo "已写入 .env.pages-runtime，各变量状态："
          awk -F= '{ printf "  %-22s %s\n", $1, (length($2)>0 ? "已设置("length($2)"字符)" : "⚠ 为空") }' .env.pages-runtime

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --env-file 让 Pages Functions 拿到运行时变量（FORMS_ACCESS_KEY 等）。
          # 2026-10-09 起因 Cloudflare 面板入口不可用，改为由 GitHub Actions 注入：
          # 敏感值存 Repository Secrets，非敏感值用 vars，构建时写入临时 env 文件。
          # 文件在 CI 临时工作区生成、随 run 结束销毁，不落入仓库。
          command: pages deploy dist --project-name=xiaominart --branch=main --commit-dirty=true --env-file=.env.pages-runtime

      # 百度「主动推送」：把本次构建出的 sitemap URL 推给百度，加快收录。
      # 为什么不用 sitemap 提交：百度对新验证站点的 sitemap 配额会显示「今日上限 0 条」
      # 且需 1-3 天释放；主动推送配额独立、当天可用、实时进入抓取队列（实测总配额 10 条/天）。
      #
      # ⚠️ 必须放在 Deploy 之后：宁可站点没更新也不要把用户导向 404 的 URL。
      # 注意 pages deploy 是即时生效的（不像 Worker 有传播延迟），此处顺序仅为语义正确。
      #
      # 设计取舍：本步骤失败**不会**让整个 workflow 标红（continue-on-error: true）——
      # 推送失败的原因都在百度侧（配额用尽、接口抖动），与站点质量无关，
      # 不该阻塞、也不该掩盖真正的构建/部署失败。详情看步骤日志。
      - name: Push URLs to Baidu (active submit)
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "${BAIDU_PUSH_TOKEN}" ]; then
            echo "⚠ BAIDU_PUSH_TOKEN 未配置，跳过百度主动推送。"
            echo "  启用方法：GitHub → Settings → Secrets and variables → Actions → Secrets → 添加 BAIDU_PUSH_TOKEN"
            exit 0
          fi
          npm run push:baidu

      # 推送进度回写：.baidu-pushed.json 记录「哪些 URL 已经推给百度」，
      # 脚本据此只推没推过的（或推送后又被修改过的）页面。
      #
      # 为什么必须提交回 main：GitHub Actions 的 job 是临时容器，工作区随 run 销毁。
      # 不回写 = 每天醒来都是空进度 = 天天重复推前 10 条，配额烧完却零进展
      # （2026-10-17/18 就是这样白烧了两天）。
      #
      # [skip ci] 是必须的：这个提交只含进度记录、不影响站点内容，
      # 不加会让状态提交再触发一次完整构建 + 部署 + 推送，形成自激循环。
      - name: Persist Baidu push progress
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .baidu-pushed.json)" ]; then
            echo "进度无变化，无需提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .baidu-pushed.json
          git commit -m "chore(baidu): 更新主动推送进度 [skip ci]"
          # deploy 组已串行化，但人工推送可能插队 → rebase 后重试，避免状态丢失
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "✓ 进度已回写 main"
              exit 0
            fi
            echo "第 ${i} 次回写失败，3 秒后重试…"
            sleep 3
          done
          echo "⚠ 进度回写失败（不影响站点部署，但明天的推送可能重复今天的批次）"
