# ─────────────────────────────────────────────────────────────
# 自动部署（阿里云主通道）：main 分支有新提交 → 质量门禁 → 构建 → rsync 到服务器
#
# 2026-10-28 切换：部署目标从 Cloudflare Pages 改为阿里云轻量服务器
# （47.97.192.90，域名已备案：苏ICP备2026082876号-1）。
# Cloudflare 版保留在 deploy-cloudflare-rollback.yml，仅手动触发，作回滚通道。
#
# 首次启用前，在 GitHub 仓库配置 4 个 Actions Secret
# （Settings → Secrets and variables → Actions → New repository secret）：
#   ALIYUN_SSH_HOST    47.97.192.90
#   ALIYUN_SSH_USER    root（或具备写 /var/www/xiaominart 权限的账号）
#   ALIYUN_SSH_PORT    22
#   ALIYUN_SSH_KEY     私钥全文（ssh-keygen 生成，公钥追加到服务器 ~/.ssh/authorized_keys）
#
# 服务器侧环境变量（/api/* 运行时读取，不经过本工作流）：
#   /var/www/xiaominart/server/.env —— FORMS_ACCESS_KEY / RESEND_API_KEY /
#   FEISHU_WEBHOOK_URL / RESEND_TO_EMAIL / ADMIN_ACCESS_KEY / BAIDU_PUSH_TOKEN
#   （10-19 迁移时已建 .env，缺 RESEND_FROM_EMAIL / RESEND_TO_EMAIL / FEISHU_KEYWORD）
#
# API 服务：functions/api/*.ts 经 server/build.mjs 编译为 server/dist/*.mjs，
# 由 systemd 服务 xiaominart-api（deploy/xiaominart-api.service）常驻 8787 端口。
# 静态站由 nginx 直接托管（deploy/nginx.conf）。
# ─────────────────────────────────────────────────────────────
name: Deploy site (Aliyun)

on:
  push:
    branches: [main]
    # 只含推送进度的提交不该触发部署：否则「部署→推送→回写进度→再部署」自激循环。
    paths-ignore:
      - '.baidu-pushed.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # 完整历史：sitemap 的 lastmod 取每个内容源文件的最后一次 git 提交时间（src/lib/seo.ts）
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 质量门禁：类型/模板诊断不过就不部署。tsconfig 已排除 server/、deploy/
      # （它们由 build:server 用 esbuild 校验，见 deploy/xiaominart-api.service）。
      - name: Type & template check
        run: npm run check

      - name: Baidu push cursor regression test
        run: npm run test:baidu

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: wwwin896-cpu-keystatic

      - name: Sitemap consistency check
        run: npm run check:sitemap

      # API 服务打包：functions/api/*.ts → server/dist/*.mjs（与 CF Pages 共用同一份源码）
      - name: Build API bundle
        run: npm run build:server

      # ── 发布到阿里云 ──────────────────────────────────────
      # 预检：验证私钥格式 + 实际 SSH 登录一次，把真实错误暴露在日志里
      - name: Preflight SSH (key & connectivity)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ALIYUN_SSH_HOST }}
          REMOTE_USER: ${{ secrets.ALIYUN_SSH_USER }}
          REMOTE_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then echo "✗ ALIYUN_SSH_KEY 为空：Secret 未配置"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          if ! ssh-keygen -y -f ~/.ssh/id_ci >/dev/null 2>&1; then
            echo "✗ 私钥格式无效（常见原因：粘贴时丢失换行/带 CRLF/贴了 .pub 公钥）"; exit 1
          fi
          echo "✓ 私钥格式有效"
          PORT="${REMOTE_PORT:-22}"
          ssh-keyscan -p "$PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          OUT=$(ssh -i ~/.ssh/id_ci -o BatchMode=yes -o StrictHostKeyChecking=no -p "$PORT" "$REMOTE_USER@$REMOTE_HOST" 'echo CONNECT_OK' 2>&1 | tail -3)
          echo "$OUT"
          echo "$OUT" | grep -q CONNECT_OK && echo "✓ SSH 登录成功" || { echo "✗ SSH 登录失败（密钥未装到服务器 authorized_keys / 用户名不对）"; exit 1; }

      # rsync --delete 保证 dist 与构建产物完全一致；--checksum 减少 SFTP 小文件开销。
      - name: Upload static site
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ALIYUN_SSH_HOST }}
          REMOTE_USER: ${{ secrets.ALIYUN_SSH_USER }}
          REMOTE_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ARGS: '-rlgoDzvc --delete'
          SOURCE: 'dist/'
          TARGET: '/var/www/xiaominart/dist/'
          EXCLUDE: '/node_modules/'

      - name: Upload API bundle
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ALIYUN_SSH_HOST }}
          REMOTE_USER: ${{ secrets.ALIYUN_SSH_USER }}
          REMOTE_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ARGS: '-rlgoDzvc'
          SOURCE: 'server/dist/ server/package.json'
          TARGET: '/var/www/xiaominart/server/'

      - name: Restart API service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_SSH_HOST }}
          username: ${{ secrets.ALIYUN_SSH_USER }}
          port: ${{ secrets.ALIYUN_SSH_PORT }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            set -e
            systemctl restart xiaominart-api
            systemctl is-active xiaominart-api
            curl -fsS -o /dev/null http://127.0.0.1:8787/api/event && echo "✓ /api/event 可达"

      # 健康检查：部署后确认公网首页与接口都活着，失败即标红。
      - name: Smoke test (public)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://xiaominart.com/ || true)
            [ "$code" = "200" ] && break
            echo "第 $i 次探测返回 $code，3 秒后重试…"; sleep 3
          done
          [ "$code" = "200" ] || { echo "✗ 首页不可达（$code）"; exit 1; }
          echo "✓ https://xiaominart.com/ 返回 200"

      # ── CDN 缓存刷新 ─────────────────────────────────────
      # 阿里云 CDN 全球加速开启后，HTML 走短缓存，必须每次部署后刷新，
      # 否则国内用户在 TTL 内拿到旧页面。需要 secret：ALIYUN_CDN_ACCESS_KEY_ID / ALIYUN_CDN_ACCESS_KEY_SECRET
      # （建议创建只含 CDN 刷新权限的 RAM 子账号，不要用主账号 AK）。
      # 未配置时跳过：CDN 面板手动刷新也可（刷新类型：目录 https://xiaominart.com/）。
      - name: Purge CDN cache
        continue-on-error: true
        env:
          ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_CDN_ACCESS_KEY_ID }}
          ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_CDN_ACCESS_KEY_SECRET }}
          PUID: ${{ secrets.ALIYUN_CDN_ACCESS_KEY_ID }}
        run: |
          if [ -z "${ALICLOUD_ACCESS_KEY}" ]; then
            echo "⚠ 未配置 CDN 刷新密钥，跳过。请在 CDN 控制台手动刷新目录 https://xiaominart.com/"
            exit 0
          fi
          curl -sG "https://cdn.aliyuncs.com/" \
            --data-urlencode "Action=RefreshObjectCaches" \
            --data-urlencode "ObjectPath=https://xiaominart.com/" \
            --data-urlencode "ObjectType=Directory" \
            --data-urlencode "Format=JSON" \
            --data-urlencode "Version=2018-05-10" \
            --data-urlencode "AccessKeyId=${ALICLOUD_ACCESS_KEY}" \
            --data-urlencode "SignatureMethod=HMAC-SHA1" \
            --data-urlencode "SignatureVersion=1.0" \
            --data-urlencode "SignatureNonce=$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            --data-urlencode "Timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /dev/null -w "CDN 刷新请求已提交（结果见阿里云控制台）\n" \
            || echo "⚠ CDN 刷新 API 调用失败（不阻塞部署），请到控制台手动刷新"

      # ── 百度主动推送（沿用原机制）──────────────────────────
      - name: Push URLs to Baidu (active submit)
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "${BAIDU_PUSH_TOKEN}" ]; then
            echo "⚠ BAIDU_PUSH_TOKEN 未配置，跳过百度主动推送。"
            exit 0
          fi
          npm run push:baidu

      - name: Persist Baidu push progress
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .baidu-pushed.json)" ]; then
            echo "进度无变化，无需提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .baidu-pushed.json
          git commit -m "chore(baidu): 更新主动推送进度 [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              :
            else
              git rebase --abort || true
              git merge --no-edit -X ours -m "chore(baidu): 合并远端后回写推送进度 [skip ci]" origin/main || true
            fi
            if git push origin HEAD:main; then
              echo "✓ 进度已回写 main（$(git rev-parse --short HEAD)）"
              exit 0
            fi
            echo "第 ${i} 次回写失败，3 秒后重试…"
            sleep 3
          done
          echo "⚠ 进度回写失败（不影响站点部署，但明天的推送可能重复今天的批次）"
